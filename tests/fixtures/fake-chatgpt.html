<!doctype html>
<html data-markup="current">
<head><meta charset="utf-8"><title>Fake ChatGPT</title></head>
<body>
<main id="thread"></main>
<!-- The composer today: no ids or test ids, controls told apart by aria-label, Send present only while there is text. -->
<template id="current">
  <form>
    <button type="button" aria-label="Add files and more">+</button>
    <div class="menu" hidden>
      <button type="button" data-list-navigation-item>Add photos &amp; files</button>
      <button type="button" data-list-navigation-item class="connector">Use rig-bridge</button>
    </div>
    <div class="ProseMirror" contenteditable="true" role="textbox" aria-label="Ask ChatGPT"></div>
    <button type="button" aria-label="Send">&uarr;</button>
  </form>
</template>
<!-- The composer as it was before, which some accounts may still be served. -->
<template id="earlier">
  <form>
    <button type="button" data-testid="composer-plus-btn">+</button>
    <div class="menu" hidden>
      <div role="menuitem" class="developer">Developer mode</div>
      <div role="menuitemcheckbox" class="connector" hidden>rig-bridge</div>
    </div>
    <div id="prompt-textarea" contenteditable="true"></div>
    <button type="button" data-testid="send-button" disabled>Send</button>
  </form>
</template>
<script>
  // Mimics the parts of chatgpt.com that the runner depends on. The test picks the markup.
  const scenario = new URLSearchParams(location.search).get("scenario") ?? "normal";
  const earlier = document.documentElement.dataset.markup === "earlier";
  document.body.append(document.getElementById(earlier ? "earlier" : "current").content.cloneNode(true));
  const form = document.querySelector("form");
  const composer = form.querySelector("[contenteditable]");
  const send = form.querySelector('[data-testid="send-button"], [aria-label="Send"]');
  const thread = document.getElementById("thread");
  const menu = form.querySelector(".menu");
  let connector = false;

  const paragraph = line => {
    const element = document.createElement("p");
    element.textContent = line;
    return element;
  };
  // Today's page adds and removes the send button; the earlier page kept it and disabled it.
  const sendReady = () => earlier ? !send.disabled : send.isConnected;
  const setSend = ready => {
    if (earlier) send.disabled = !ready;
    else if (ready) form.append(send);
    else send.remove();
  };
  const refresh = () => {
    const empty = composer.innerText.trim() === "";
    if (["slow-send", "delayed-draft", "delayed-busy"].includes(scenario) && !empty && !sendReady()) {
      // The send button takes a second to become ready once text is entered.
      setTimeout(() => { setSend(composer.innerText.trim() !== ""); }, 1000);
      return;
    }
    setSend(!empty);
  };
  setSend(false);
  composer.addEventListener("input", refresh);
  // ChatGPT restores unsent text saved for a conversation, at load or a moment later.
  if (scenario === "draft") {
    composer.append(paragraph("Unsent draft."));
    refresh();
  }
  if (scenario !== "no-paste") {
    // ProseMirror turns pasted plain text into paragraphs and keeps what the composer already holds.
    composer.addEventListener("paste", event => {
      event.preventDefault();
      if (scenario === "late-draft") composer.append(paragraph("Unsent draft."));
      composer.append(...event.clipboardData.getData("text/plain").split("\n").map(paragraph));
      refresh();
      // The draft is restored after the message was entered, before the send button is ready.
      if (scenario === "delayed-draft") setTimeout(() => { composer.append(paragraph("Unsent draft.")); }, 400);
      // A reply starts in the conversation after the message was entered, as when another tab sends to it.
      if (scenario === "delayed-busy") setTimeout(stop, 400);
    });
  }
  // Radix menus open on pointerdown, so synthetic element.click() is not enough.
  form.querySelector("button").addEventListener("pointerdown", () => { menu.hidden = false; });
  // The earlier menu kept connectors in a submenu; today's lists them directly.
  menu.querySelector(".developer")?.addEventListener("click", () => { menu.querySelector(".connector").hidden = false; });
  menu.querySelector(".connector").addEventListener("click", () => { connector = true; });
  document.addEventListener("keydown", event => { if (event.key === "Escape") menu.hidden = true; });

  const stop = () => {
    const button = document.createElement("button");
    if (earlier) {
      button.dataset.testid = "stop-button";
      button.textContent = "Stop";
    } else {
      button.setAttribute("aria-label", "Stop");
      button.textContent = "■";
    }
    form.append(button);
    return button;
  };
  // Today's page marks each message as a search unit whose key ends in its author.
  let units = 0;
  const message = (author, lines) => {
    const element = document.createElement("div");
    const markdown = document.createElement("div");
    if (earlier) {
      element.dataset.messageAuthorRole = author;
      markdown.className = "markdown";
    } else {
      element.dataset.chatgptSearchUnitKey = `${units++}:${author}`;
      markdown.dataset.markdownTextStyle = `${author}-message`;
    }
    markdown.replaceChildren(...lines.map(paragraph));
    element.append(markdown);
    thread.append(element);
  };
  const reply = lines => message("assistant", lines);
  const later = ms => new Promise(resolve => setTimeout(resolve, ms));
  // Lets the test see what the page was asked to do.
  const tell = (kind, text = "") => fetch("/page-events", { method: "POST", body: JSON.stringify({ kind, text }) }).catch(() => {});
  const address = path => {
    history.pushState({}, "", path);
    tell("address", location.pathname);
  };

  // An existing conversation already shows an earlier assistant reply.
  const existing = location.pathname.startsWith("/c/");
  if (existing) reply(["Earlier assistant reply."]);
  if (scenario === "busy") stop();
  if (scenario === "moved") history.replaceState({}, "", "/");
  if (scenario === "signed-out") {
    const login = document.createElement("button");
    login.textContent = "Log in";
    form.replaceWith(login);
  }

  send.addEventListener("click", async () => {
    const prompt = composer.innerText;
    tell("sent", prompt);
    if (scenario === "stuck") return;
    composer.replaceChildren();
    refresh();
    message("user", prompt.split("\n"));
    // A new chat is shown under a temporary identifier until ChatGPT has saved it.
    const temporary = ["temporary-address", "no-lasting-address", "written-address"].includes(scenario);
    if (!existing) address(temporary ? "/c/local-chatgpt%3A570c498e-7d4a-48a1-8e7a-d7367e869bf0" : "/c/fake-conversation");
    // The assistant can put the address it was shown, the temporary one, in its own event.
    const written = scenario === "written-address" ? { conversation: location.href } : {};
    const event = JSON.stringify({ type: "completed", connector, prompt, ...written });
    let generating = stop();
    await later(300);
    if (scenario === "approve") {
      generating.remove();
      const confirm = document.createElement("button");
      confirm.textContent = "Confirm";
      thread.append(confirm);
      await new Promise(resolve => confirm.addEventListener("click", resolve, { once: true }));
      confirm.remove();
      tell("approved");
      generating = stop();
      await later(200);
    }
    reply(["Working…"]);
    await later(300);
    thread.lastElementChild.remove();
    generating.remove();
    reply(scenario === "no-event" || scenario === "handoff-no-event" ? ["Finished without event line."] : ["Finished the task.", `MACHINES_EVENT ${event}`]);
    // The lasting address can arrive as late as the end of the reply.
    if (scenario === "temporary-address") address("/c/fake-conversation");
  });
</script>
</body>
</html>
