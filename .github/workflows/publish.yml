name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match the stable package.json version (vX.Y.Z).');
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke:package
      - run: npm run build:plugin
      - run: npm run smoke:plugin
      - name: Check publication contents
        run: npm publish --dry-run --offline
      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: npm publish
