<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: light-dark(#f7f7f5, #171715);
      --panel: light-dark(#ffffff, #22221f);
      --line: light-dark(#deded8, #3d3d38);
      --text: light-dark(#20201d, #f1f1ec);
      --muted: light-dark(#6d6d66, #aaa9a0);
      --accent: light-dark(#287a6a, #62c8b1);
      --warn: light-dark(#8a5b00, #f2c45e);
      --bad: light-dark(#a2352a, #ff8d82);
      --good: light-dark(#247342, #68cf8a);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: transparent; }
    main {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 10px 28px color-mix(in srgb, #000 12%, transparent);
    }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
    .mark { color: var(--accent); font-size: 18px; line-height: 1; }
    h1 { min-width: 0; flex: 1; margin: 0; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .badge { border-radius: 999px; padding: 4px 8px; background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); font-size: 12px; font-weight: 650; }
    .badge.waiting { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
    .badge.completed { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
    .badge.failed { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
    .body { padding: 0 16px 15px; }
    .state { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
    .state strong { font-weight: 680; }
    .elapsed, .meta { color: var(--muted); font-size: 12px; }
    .meta { margin-top: 5px; }
    .human { margin-top: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
    .prompt { margin: 0 0 10px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; }
    button, input { font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--text);
      background: var(--bg);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled, input:disabled { cursor: default; opacity: .55; }
    form { display: flex; width: 100%; gap: 7px; margin-top: 8px; }
    input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; color: var(--text); background: var(--bg); }
    .error { margin: 12px 0 0; color: var(--bad); font-size: 13px; line-height: 1.4; }
    .done { margin: 11px 0 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <header>
      <span class="mark" aria-hidden="true">◆</span>
      <h1 id="machine">Machine</h1>
      <span class="badge" id="status">starting</span>
    </header>
    <section class="body">
      <div class="state"><strong id="state">starting</strong><span class="elapsed" id="elapsed"></span></div>
      <div class="meta" id="agent"></div>
      <div class="human" id="human" hidden>
        <p class="prompt" id="prompt"></p>
        <div class="actions" id="actions"></div>
      </div>
      <p class="error" id="error" hidden></p>
      <p class="done" id="done" hidden></p>
    </section>
  </main>
  <script>
    const elements = Object.fromEntries(
      ["machine", "status", "state", "elapsed", "agent", "human", "prompt", "actions", "error", "done"]
        .map((id) => [id, document.getElementById(id)])
    );
    const pending = new Map();
    let requestId = 1;
    let run;
    let timer;
    let busy = false;
    let refreshing = false;
    let closed = false;
    let revision = 0;
    let renderedHumanKey;
    let responseError;
    let statusError;

    function callTool(name, args) {
      if (window.openai?.callTool) return window.openai.callTool(name, args);
      const id = requestId++;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method: "tools/call", params: { name, arguments: args } }, "*");
      });
    }

    function toolData(result) {
      const payload = result?.result ?? result;
      if (payload?.isError) {
        const message = payload.content?.filter((item) => item.type === "text").map((item) => item.text).join("\n");
        throw new Error(message || "The Machine tool failed.");
      }
      const data = payload?.structuredContent;
      if (!data?.run && !data?.runs?.length) throw new Error("The Machine tool did not return a run.");
      return data;
    }

    function receive(data) {
      const next = data?.run ?? data?.runs?.[0];
      if (!next || closed) return;
      if (humanKey(next) !== humanKey(run)) responseError = undefined;
      statusError = undefined;
      revision += 1;
      run = next;
      render();
      schedule();
    }

    function humanKey(snapshot) {
      return snapshot?.status === "waiting" && snapshot.human
        ? JSON.stringify([snapshot.id, snapshot.human.requestId])
        : undefined;
    }

    function renderError() {
      const error = run?.error ?? responseError ?? statusError;
      elements.error.hidden = !error;
      elements.error.textContent = error ?? "";
    }

    function render() {
      const terminal = run.status === "completed" || run.status === "failed";
      elements.machine.textContent = run.machine;
      elements.status.textContent = run.status === "waiting" ? "input needed" : run.status;
      elements.status.className = `badge ${run.status}`;
      elements.state.textContent = typeof run.state === "string" ? run.state : run.state ? JSON.stringify(run.state) : "starting";
      elements.elapsed.textContent = `${run.elapsedSeconds}s`;
      elements.agent.textContent = run.agent
        ? [run.agent.harness, run.agent.model, run.agent.thinking ? `thinking ${run.agent.thinking}` : undefined].filter(Boolean).join(" · ")
        : "";
      renderError();
      elements.done.hidden = !terminal || Boolean(run.error);
      elements.done.textContent = run.status === "completed" ? "Finished." : "";
      renderHuman();
    }

    function renderHuman() {
      const human = run.status === "waiting" ? run.human : undefined;
      elements.human.hidden = !human;
      const key = humanKey(run);
      if (key === renderedHumanKey) {
        for (const control of elements.actions.querySelectorAll("button, input")) control.disabled = busy;
        return;
      }
      renderedHumanKey = key;
      elements.actions.replaceChildren();
      if (!human) return;
      elements.prompt.textContent = human.prompt;
      const target = { runId: run.id, requestId: human.requestId };
      const values = human.choices ?? human.suggestions ?? [];
      for (const value of values) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = value;
        button.disabled = busy;
        button.onclick = () => respond(target, value);
        elements.actions.append(button);
      }
      if (!human.choices) {
        const form = document.createElement("form");
        const input = document.createElement("input");
        const submit = document.createElement("button");
        input.placeholder = "Other response";
        input.setAttribute("aria-label", "Machine response");
        input.disabled = busy;
        submit.type = "submit";
        submit.textContent = "Send";
        submit.disabled = busy;
        form.append(input, submit);
        form.onsubmit = (event) => {
          event.preventDefault();
          if (input.value !== "") respond(target, input.value);
        };
        elements.actions.append(form);
      }
    }

    async function respond(target, response) {
      const key = JSON.stringify([target.runId, target.requestId]);
      if (closed || busy || key !== humanKey(run)) return;
      const focused = elements.actions.contains(document.activeElement) ? document.activeElement : undefined;
      busy = true;
      responseError = undefined;
      const startedAt = ++revision;
      clearTimeout(timer);
      renderHuman();
      renderError();
      try {
        const result = await callTool("machine_respond", { ...target, response });
        if (!closed && revision === startedAt) receive(toolData(result));
      } catch (error) {
        if (!closed && key === humanKey(run)) {
          responseError = error?.message ?? String(error);
          renderError();
        }
      } finally {
        busy = false;
        if (!closed) {
          renderHuman();
          if (focused && elements.actions.contains(focused) && (!document.activeElement || document.activeElement === document.body)) focused.focus();
          schedule();
        }
      }
    }

    function schedule(delay = 1000) {
      clearTimeout(timer);
      if (closed || busy || refreshing || !run || run.status === "completed" || run.status === "failed") return;
      timer = setTimeout(refresh, delay);
    }

    async function refresh() {
      if (closed || refreshing || busy || !run) return;
      refreshing = true;
      const startedAt = revision;
      let delay = 1000;
      try {
        const result = await callTool("machine_status", { runId: run.id });
        if (!closed && revision === startedAt) {
          const data = toolData(result);
          receive(data);
        }
      } catch (error) {
        if (!closed && revision === startedAt) {
          statusError = error?.message ?? String(error);
          renderError();
          delay = 3000;
        }
      } finally {
        refreshing = false;
        schedule(delay);
      }
    }

    window.addEventListener("message", (event) => {
      if (closed || event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) {
        const request = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) request.reject(message.error);
        else request.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-result") {
        try {
          receive(toolData(message.params));
        } catch (error) {
          statusError = error?.message ?? String(error);
          renderError();
          schedule(3000);
        }
      }
    }, { passive: true });

    window.addEventListener("pagehide", () => {
      closed = true;
      clearTimeout(timer);
      for (const request of pending.values()) request.reject(new Error("The Machine card was closed."));
      pending.clear();
    }, { once: true });

    receive(window.openai?.toolOutput);
  </script>
</body>
</html>
